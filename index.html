document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er }}\" sc-camel-on-change=\"{{ setMatter }}\" style=\"border:1px solid #C7C0B6;border-radius:2px;padding:14px 16px;font-size:17px;background:#FAF8F4;color:#26231E;outline:none\"><sc-for list=\"{{ matters }}\" as=\"o\" hint-placeholder-count=\"6\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n          <label style=\"grid-column:1/-1;display:grid;gap:8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#544E46\">Anything we should know?<textarea value=\"{{ form.notes }}\" sc-camel-on-change=\"{{ setNotes }}\" rows=\"4\" placeholder=\"Optional\" style=\"border:1px solid #C7C0B6;border-radius:2px;padding:14px 16px;font-size:17px;background:#FAF8F4;color:#26231E;outline:none;resize:vertical;font-family:inherit\" style-focus=\"border-color:#BFA750;box-shadow:0 0 0 3px rgba(191,167,80,.25)\"><\u002Ftextarea><\u002Flabel>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ submit }}\" style=\"margin-top:24px;width:100%;background:#BFA750;color:#0B1F3D;border:0;cursor:pointer;padding:18px 28px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;transition:background .25s,transform .25s\" style-hover=\"background:#D3BE72;transform:translateY(-2px)\">Request my call<\u002Fbutton>\n        <p style=\"margin:14px 0 0;font-size:13px;color:#8C857A;text-align:center\">No obligation. Your information stays private.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"text-align:center;padding:40px 0;animation:fadeIn .6s both\">\n          <img src=\"a2c5ad19-53d2-442f-ac5b-5ccafbbb74b8\" alt=\"\" style=\"height:72px;border-radius:6px\">\n          <h2 style=\"font-family:Cinzel,Georgia,serif;font-size:30px;color:#0B1F3D;margin:24px 0 10px;font-weight:600\">Thank you, {{ firstName }}.<\u002Fh2>\n          <p style=\"font-family:Alegreya,Georgia,serif;font-size:19px;color:#544E entry 0% entry 35%\" style-hover=\"transform:translateY(-4px);box-shadow:0 18px 44px rgba(11,31,61,.12);border-color:#BFA750\">\n        <div style=\"display:flex;justify-content:space-between;gap:16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#7E6A22\"><span>{{ p.category }}<\u002Fspan><span style=\"color:#8C857A\">{{ p.read }}<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-family:Cinzel,Georgia,serif;font-size:{{ p.titleSize }};line-height:1.15;color:#0B1F3D;margin:0;font-weight:600;text-wrap:balance\">{{ p.title }}<\u002Fh2>\n        <p style=\"font-family:Alegreya,Georgia,serif;font-size:18px;line-height:1.6;color:#544E46;margin:0;flex:1\">{{ p.excerpt }}<\u002Fp>\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:18px;border-top:1px solid #E2DCD2;font-size:14px;color:#6E675E\"><span>{{ p.author }} · {{ p.date }}<\u002Fspan><span style=\"color:#183A6A;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px\">Read →<\u002Fspan><\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<!-- ============ BLOG POST ============ -->\n<sc-if value=\"{{ showPost }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Blog post\">\n<section style=\"background:#0B1F3D;padding:200px 32px 100px;position:relative;overflow:hidden\">\n  <div style=\"position:absolute;inset:0;background:radial-gradient(ellipse at 10% 100%,rgba(191,167,80,.16),transparent 50%)\"><\u002Fdiv>\n  <div style=\"position:relative;max-width:1280px;margin:0 auto\">\n    <button sc-camel-on-click=\"{{ goBlog }}\" style=\"background:none;border:0;padding:0;cursor:pointer;color:#D3BE72;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;animation:heroIn .8s cubic-bezier(.22,.61,.36,1) both\" style-hover=\"color:#fff\">← Blog · {{ post.category }}<\u002Fbutton>\n    <h1 style=\"font-family:Cinz ced' && this.hero && window.innerWidth > 640) {\n        this.hero.style.transform = `translateY(${y * 0.28}px)`;\n        if (this.heroContent) { this.heroContent.style.opacity = Math.max(0, 1 - y / 650); this.heroContent.style.transform = `translateY(${y * 0.12}px)`; }\n      }\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onKey = e => { if (e.key === 'Escape') this.setState({ modal: false, menu: false }); };\n    window.addEventListener('keydown', this.onKey);\n    this.setupCounters();\n    this.counterTimer = setInterval(() => this.setupCounters(), 400);\n    this.onHash = () => this.applyRoute();\n    window.addEventListener('hashchange', this.onHash);\n    this.applyRoute(true);\n  }\n  componentWillUnmount() { clearInterval(this.heroLoop); window.removeEventListener('scroll', this.onScroll); window.removeEventListener('keydown', this.onKey); window.removeEventListener('hashchange', this.onHash); clearInterval(this.counterTimer); }\n  // Routing: \"#/path\" wins; on a real host without a hash, the pathname is the route (so /blog/ deep-links and unknown paths land on the 404).\n  routePath() {\n    if (location.hash && location.hash.length > 1) return location.hash.replace(/^#\\/?/, '').replace(/\\/+$/, '');\n    if (location.hash === '#/' || location.hash === '#') return '';\n    const p = location.pathname.replace(/^\\/+|\\/+$/g, '');\n    return (!p || /\\.html?$/i.test(p) || p === 'index') ? '' : p;\n  }\n  resolve(path) {\n    const parts = path.split('/').filter(Boolean).map(decodeURIComponent);\n    const [a, b] = parts;\n    if (!a) return { page: 'home', slug: '' };\n    const flat = { services: 'services', 'our-team': 'team', team: 'team', contact: 'contact', faq: 'faq', 'frequently-asked-questions': 'faq', blog: 'blog', 'privacy-policy': 'privacy', privacy: 'privacy' };\n    if (parts.length === 1 && flat[a]) return { page: flat[a], slug: '' };\n    if (a === 'services' && b && this.serviceBySlug(b)) return { page: 'service', slug: b };\n    if ((a === 'our-team' || a === 'team') && b && this.personBySlug(b)) return { page: 'person', slug: b };\n    if (a === 'blog' && b && this.postBySlug(b)) return { page: 'post', slug: b };\n    if (parts.length === 1 && this.postBySlug(a)) return { page: 'post', slug: a };\n    return { page: 'notfound', slug: '' };\n  }\n  applyRoute(initial) {\n    const r = this.resolve(this.routePath());\n    if (r.page !== this.state.page || r.slug !== this.state.slug) this.setState({ ...r, menu: false });\n    else if (initial && r.page === 'home' && location.hash) history.replaceState(null, '', location.pathname + location.search);\n  }\n  pathFor(page, slug) {\n    const map = { home: '', services: 'services', team: 'our-team', contact: 'contact', faq: 'frequently-asked-questions', blog: 'blog', privacy: 'privacy-policy', service: 'services/' + slug, person: 'our-team/' + slug, post: 'blog/' + slug, notfound: '404' };\n    return map[page] ?? '';\n  }\n  componentDidUpdate(_, prev) {\n    if (prev.page !== this.state.page || prev.slug !== this.state.slug) { window.scrollTo(0, 0); this.hero = null; this.heroContent = null; }\n    this.setupCounters();\n    document.body.style.overflow = (this.state.modal || this.state.menu) ? 'hidden' : '';\n  }\n  motion() { return this.props.motion ?? 'max'; }\n  setupCounters() {\n    const vh = window.innerHeight;\n    document.querySelectorAll('[data-count]').forEach(el => {\n      if (el.dataset.done) return;\n      const r = el.getBoundingClientRect();\n      if (r.top > vh * 0.9 || r.bottom < 0) return;\n      el.dataset.done = '1';\n      const target = parseFloat(el.dataset.count);\n      if (isNaN(target)) { delete el.dataset.done; return; }\n      if (this.motion() === 'reduced') { el.textContent = target; return; }\n      const t0 = performance.now(), dur = 1800;\n      const tick = now => {\n        const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);\n        el.textContent = Math.round(target * e);\n        if (p < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    });\n  }\n  go(page, slug = '') {\n    return () => {\n      const target = '#/' + this.pathFor(page, slug);\n      if (location.hash === target) return this.setState({ page, slug, menu: false });\n      location.hash = target;\n      this.setState({ page, slug, menu: false });\n    };\n  }\n  serviceBySlug(s) { return this.serviceData().find(x => x.slug === s); }\n  personBySlug(s) { return this.teamData().find(x => x.slug === s); }\n  postBySlug(s) { return this.posts().find(x => x.slug === s); }\n  teamData() {\n    return [\n      { slug: 'h-scott-ross', name: 'H. Scott Ross', first: 'Scott', role: 'Attorney', email: 'scott@rosslawoffice.net', ext: '6', img: ASSETS['assets/team-scott-ross.jpg'],\n        bio: 'Scott brings decades of Mississippi practice to closings, civil matters and estate administration. Clients know him for steady counsel and a phone that gets answered.',\n        tagline: 'Decades of Mississippi practice in real estate, civil matters and estate administration. Steady counsel, and a phone that gets answered.',\n        paras: ['Scott has practiced law in West Point for the better part of four decades. In that time he has closed thousands of real estate transactions, guided families through probate after a loss, and represented neighbors in civil matters across the Golden Triangle.', 'His approach is simple: explain the situation honestly, lay out the options, and then do the work. Clients who came to Scott for a first home closing tend to come back years later for a parent\\'s estate, and send their children after that.', 'Scott and his son Stephen practice together at 384 Court Street, giving the firm both deep local roots and a modern estate planning practice under one roof.'],\n        focus: ['Residential and commercial closings', 'Probate and estate administration', 'Civil litigation', 'Personal injury claims', 'Title examination', 'Deed preparation'] },\n      { slug: 'stephen-s-ross', name: 'Stephen S. Ross', first: 'Stephen', role: 'Attorney · Estate Planning', email: 'stephen@rosslawoffice.net', ext: '5', img: ASSETS['assets/team-stephen-ross.jpg'],\n        bio: 'Stephen leads the firm\\'s estate planning practice, designing Family, Trust and Wealth Plans that keep families out of probate and children protected by the guardians their parents choose.',\n        tagline: 'Leads the firm\\'s estate planning practice, designing plans that keep families out of probate and children in the care of the people their parents choose.',\n        paras: ['Stephen grew up in West Point and returned home to practice after law school with one goal: make real estate planning accessible to ordinary Mississippi families, not just the wealthy.', 'He built the firm\\'s planning process around outcomes rather than documents. Every plan begins with a two-hour design meeting where families see exactly what would happen under current law, then choose the level of protection that fits. Every plan ends with a signed binder, properly titled assets, and a standing invitation to review as life changes.', 'Stephen is a frequent speaker for local churches, schools and civic groups on guardianship planning for parents of minor children.'],\n        focus: ['Revocable living trusts', 'Wills and powers of attorney', 'Guardianship planning for minor children', 'Healthcare directives', 'Trust administration', 'Business succession'] },\n      { slug: 'nikki-russell-cude', name: 'Nikki Russell Cude', first: 'Nikki', role: 'Paralegal', email: 'nikki@rosslawoffice.net', ext: '0', img: ASSETS['assets/team-nikki-russell-cude.jpg'],\n        bio: 'Your first call and your steady guide. Nikki schedules consultations, prepares documents and keeps every matter moving on time.',\n        tagline: 'Your first call and your steady guide from consultation to signed binder.',\n        paras: ['When you call the office, Nikki answers. She schedules your free consultation, gathers the information Stephen needs before your planning meeting, and keeps you posted while your documents are drafted.', 'Nikki has spent her career in Mississippi law offices and knows that most people calling a law firm are doing so on a hard day. She makes the process clear, calm and on schedule.'],\n        focus: ['Scheduling and intake', 'Estate planning document preparation', 'Client communication', 'Probate filings', 'Notary services'] },\n      { slug: 'lauren-coggins-frazier', name: 'Lauren Coggins-Frazier', first: 'Lauren', role: 'Closing Associate', email: 'lauren@rosslawoffice.net', ext: '3', img: ASSETS['assets/team-lauren-coggins-frazier.jpg'],\n        bio: 'Lauren coordinates title work, lenders and realtors so that closing day is exactly that — a closing, not a scramble.',\n        tagline: 'Coordinates title work, lenders and realtors so closing day is exactly that: a closing, not a scramble.',\n        paras: ['Lauren runs the firm\\'s real estate closing desk. From the moment a contract arrives she orders title, tracks lender conditions, prepares the closing package and makes sure funds are ready to disburse the moment signatures are on paper.', 'Realtors and lenders across the Golden Triangle work with Lauren because she communicates early and closes on time. Buyers and sellers appreciate that she explains every document at the table.'],\n        focus: ['Purchase and refinance closings', 'Title orders and clearance', 'Lender coordination', 'Closing disclosure preparation', 'Recording and disbursement'] }\n    ];\n  }\n  serviceData() {\n    return [\n      { slug: 'wills-estates-trusts', num: '01', tag: 'Wills · Trusts · Probate', title: 'Estate Planning', blurb: 'Family Plans, Trust Plans and Wealth Plans that avoid probate, minimize taxes and pass assets on cleanly.', detail: 'Our planning goes far beyond a simple will. We build a complete system — documents, funding, and ongoing review — so your wishes are honored and your family is never left guessing.', items: ['Revocable living trusts', 'Last will and testament', 'Powers of attorney', 'Healthcare directives', 'Trust administration', 'Deed & account transfers'], imgOrder: 0,\n        paras: ['Most families arrive with the same question: do I need a will or a trust? The honest answer depends on what you own, who depends on you, and how much of the process you want to keep out of a Mississippi chancery court. That is why every plan starts with a design meeting rather than a form.', 'Our three plan tiers cover every stage of life. The Family Plan gives young families the essentials. The Trust Plan adds a revocable living trust for full probate avoidance and privacy. The Wealth Plan adds hands-on asset transfer and ongoing administration for larger or more complex estates.'],\n        steps: [{ title: 'Free 15-minute call', text: 'Tell us about your family and what you own. We will tell you whether a will, a trust or something else fits, and what it costs.' }, { title: 'Planning meeting', text: 'A two-hour design session where you see what happens under current law and choose your plan level. No surprises on price.' }, { title: 'Signing and binder', text: 'About four weeks later you sign, we title assets correctly, and you leave with a binder and digital copies. We review as life changes.' }] },\n      { slug: 'guardianship-planning', num: '02', tag: 'For parents of minor children', title: 'Guardianship Planning', blurb: 'Legally name guardians, leave instructions, and make sure your children are never in the hands of strangers — even for a night.', detail: 'If something happened to you tonight, who would the authorities call? Our guardianship planning answers that question in writing, with short- and long-term guardians, care instructions and financial safeguards.', items: ['Short-term guardianship', 'Long-term guardian nominations', 'Confidential exclusions', 'Instructions to caregivers', 'Trust for minors'], imgOrder: 2,\n        paras: ['A will alone does not solve this. A will is read after a death, often weeks later, and only names a permanent guardian. It says nothing about the first hours, when a first responder needs to know who to call so your children are not placed with strangers while the paperwork catches up.', 'Guardianship planning fills that gap with named short-term guardians who can be at your door in minutes, long-term nominations for the court, confidential exclusions of anyone you would never want raising your children, and written instructions for how you want them raised.'],\n        steps: [{ title: 'Choose your people', text: 'We walk you through picking short-term and long-term guardians, and who to exclude, without the guilt of leaving anyone out.' }, { title: 'Put it in writing', text: 'Legal nominations, wallet cards for first responders, and instructions your guardians can actually follow.' }, { title: 'Fund their future', text: 'A trust for minors so the money follows your children and is managed by someone you trust, not handed over at eighteen.' }] },\n      { slug: 'real-estate-closings', num: '03', tag: 'Residential & commercial', title: 'Real Estate Closings', blurb: 'Title work, lender coordination and a closing table that runs on time.', detail: 'From contract to keys, Lauren and Scott handle title examination, document preparation, funds disbursement and recording for buyers, sellers, lenders and realtors across the Golden Triangle.', items: ['Title examination & insurance', 'Purchase & refinance closings', 'Deed preparation', 'Lender coordination', 'For-sale-by-owner support'], imgOrder: 0,\n        paras: ['A closing should be the calmest part of buying or selling property. That takes work weeks before the table: a clean title search, lender conditions cleared early, and a closing package everyone has seen before they sit down.', 'We close residential and commercial transactions for buyers, sellers, lenders, realtors and for-sale-by-owner deals throughout Clay, Lowndes, Oktibbeha and surrounding counties.'],\n        steps: [{ title: 'Contract received', text: 'Send us the executed contract. We open the file, order title and introduce ourselves to every party the same day.' }, { title: 'Title and conditions', text: 'We examine title, clear any issues, coordinate with the lender and prepare the closing disclosure and deed.' }, { title: 'Closing day', text: 'Signatures, funding and recording, explained document by document. Keys change hands on time.' }] },\n      { slug: 'expungements-and-dui-defense', num: '04', tag: 'Second chances', title: 'Expungements & DUI Defense', blurb: 'Clear a record that is holding you back, or mount a real defense from day one.', detail: 'A past mistake shouldn\\'t define your future. We petition for expungement where Mississippi law allows and defend DUI charges with attention to every procedural detail.', items: ['Misdemeanor & felony expungement', 'First-offense DUI defense', 'License hearings', 'Non-adjudication petitions'], imgOrder: 2,\n        paras: ['Mississippi law allows many misdemeanor and certain felony convictions to be expunged once the required waiting period has passed. An expunged record no longer appears on most background checks, which can reopen doors to employment, housing and professional licensing.', 'For DUI charges, timing matters. Administrative license deadlines run quickly after an arrest, and the details of the stop, the testing and the paperwork often decide the case. Call early.'],\n        steps: [{ title: 'Eligibility review', text: 'We pull the record, confirm what qualifies under current statute and tell you plainly what can and cannot be cleared.' }, { title: 'Petition and hearing', text: 'We prepare and file the petition, notify the required parties and represent you at any hearing.' }, { title: 'Clean record', text: 'Once the order is entered we confirm the record has been updated with the relevant agencies.' }] },\n      { slug: 'personal-injury-and-civil-practice', num: '05', tag: 'Civil practice', title: 'Personal Injury & Civil Practice', blurb: 'Motor-vehicle accidents and civil claims, handled by neighbors who will still be here after the case closes.', detail: 'When you\\'ve been hurt, you need answers and an advocate — not a billboard. We handle motor-vehicle accident claims and general civil matters with the same care we bring to family planning.', items: ['Motor-vehicle accidents', 'Insurance negotiations', 'Civil litigation', 'Contingency-fee representation'], imgOrder: 0,\n        paras: ['After an accident the insurance company already has a lawyer. You should too. We handle motor-vehicle accident claims on a contingency basis, meaning no fee unless we recover for you, and we keep you informed in plain language throughout.', 'Our civil practice also covers contract disputes, property matters and other everyday legal problems that Mississippi families and small businesses run into.'],\n        steps: [{ title: 'Free case review', text: 'Tell us what happened. We will give you an honest read on the claim and what to expect.' }, { title: 'Investigation and demand', text: 'We gather records, document damages and negotiate with the insurer from a position of strength.' }, { title: 'Settlement or trial', text: 'Most cases settle. If a fair offer never comes, we are prepared to file suit and see it through.' }] }\n    ];\n  }\n  posts() {\n    const S = 'Stephen S. Ross';\n    return [\n      { slug: 'from-west-point-to-your-familys-future-my-mission-to-make-estate-planning-accessible', category: 'From Stephen', title: 'From West Point to Your Family\\'s Future: My Mission to Make Estate Planning Accessible', author: S, date: 'March 2025', read: '5 min read', featured: true,\n        excerpt: 'I came home to West Point to practice law for a reason. Estate planning has been sold as something for wealthy families. It is not. It is for anyone with people who depend on them.',\n        sections: [\n          { heading: 'Why I came home', paras: ['I grew up on these streets. I know the families here, the farms, the small businesses that have been passed down two and three generations, and I know how many of them have no plan for what happens next.', 'When I finished law school I could have joined a firm in Jackson or Memphis. I chose 384 Court Street instead, because the people who most need a real plan are the ones least likely to walk into a downtown high-rise to get one.'] },\n          { heading: 'What accessible actually means', paras: ['Accessible does not mean cheap documents. A two-hundred-dollar will that leaves your assets in probate for a year is the most expensive document you will ever sign. Accessible means three things:'], list: ['Flat, published pricing decided before any work begins, so nobody is afraid to ask.', 'Plain English. If you leave a meeting unsure what you signed, we failed.', 'A relationship, not a transaction. Your plan gets reviewed as your life changes, at no surprise cost.'] },\n          { heading: 'The invitation', paras: ['If you have children, a home, a business, or a parent who is getting older, you have an estate, and you have a plan whether you wrote it or not. The State of Mississippi wrote one for you. I would rather you wrote your own.', 'The first call is fifteen minutes and costs nothing. Ask for Nikki.'] }\n        ] },\n      { slug: 'estate-planning-myths-setting-the-record-straight', category: 'Myths series', title: 'Estate Planning Myths: Setting the Record Straight', author: S, date: 'April 2025', read: '4 min read',\n        excerpt: 'Four beliefs keep Mississippi families from planning. Every one of them is wrong, and each one costs somebody\\'s family real money and real heartache.',\n        sections: [\n          { heading: 'The four myths', paras: ['In hundreds of planning meetings I hear the same four objections. They sound reasonable. They are not. Over the next four posts I take each one apart.'], list: ['Myth 1: \"I don\\'t have very many assets, so I don\\'t have an estate.\"', 'Myth 2: \"I\\'m too young to need estate planning.\"', 'Myth 3: \"A simple will is enough.\"', 'Myth 4: \"Estate planning is just about death.\"'] },\n          { heading: 'Why myths are expensive', paras: ['Each of these beliefs leads to the same outcome: a family in a chancery courtroom, months after a loss, paying lawyers to sort out what a few hours of planning would have settled. Probate in Mississippi typically runs eight to sixteen months and costs a meaningful percentage of the estate. It is also public record.', 'The good news is that every one of these myths dissolves the moment you see how planning actually works. Start with Myth 1.'] }\n        ] },\n      { slug: 'myth-1-i-dont-have-very-many-assets-so-i-dont-have-an-estate', category: 'Myths series', title: 'Myth #1: \"I Don\\'t Have Very Many Assets So I Don\\'t Have an Estate\"', author: S, date: 'April 2025', read: '4 min read',\n        excerpt: 'If you own anything, or anyone depends on you, you have an estate. The size of it changes the plan, not whether you need one.',\n        sections: [\n          { heading: 'What an estate really is', paras: ['Your estate is everything you own and everything you owe at the moment you pass: your house, your truck, your bank accounts, retirement savings, life insurance, that piece of family land, and yes, your debts. For most working Mississippi families it adds up to far more than they expect once life insurance and retirement accounts are counted.'] },\n          { heading: 'Small estates still go to court', paras: ['Mississippi does offer a simplified process for very small estates, but the threshold is low and it does not cover real property. If your name is on a deed, your family is going to chancery court without a plan, regardless of what the house is worth.', 'And a modest estate hurts more in probate, not less. Court costs and attorney fees are a bigger share of a $150,000 estate than a $1.5 million one.'] },\n          { heading: 'The people, not the money', paras: ['Most importantly, if you have minor children, your estate plan is the only legal document that tells a judge who should raise them. That question has nothing to do with net worth.'] }\n        ] },\n      { slug: 'myth-2-im-too-young-to-need-estate-planning', category: 'Myths series', title: 'Myth #2: \"I\\'m Too Young to Need Estate Planning\"', author: S, date: 'May 2025', read: '3 min read',\n        excerpt: 'Planning is not about your age. It is about who would be affected tomorrow if you were not here, and how much of a mess you would leave them.',\n        sections: [\n          { heading: 'Young families have the most at stake', paras: ['A sixty-five-year-old with grown children and a paid-off house has a simpler situation than a thirty-two-year-old with a mortgage, two kids under ten and a spouse who depends on their income. The younger family has more moving parts and fewer resources to absorb a mistake.', 'Without a plan, a young parent\\'s life insurance can end up in a court-supervised account until the child turns eighteen, then be handed over in a lump sum. Nobody designs it that way on purpose.'] },\n          { heading: 'Incapacity, not just death', paras: ['A car accident that leaves you in the hospital for six weeks is a far more likely event than dying young. Without a power of attorney and healthcare directive, your spouse may need a court order to pay your mortgage or make medical decisions. Planning handles this in an afternoon.'] },\n          { heading: 'Plans grow with you', paras: ['A plan written at thirty is not a plan for life. It is a foundation that gets reviewed and adjusted as your family, your assets and the law change. Starting early is the cheapest version.'] }\n        ] },\n      { slug: 'myth-3-a-simple-will-is-enough', category: 'Myths series', title: 'Myth #3: \"A Simple Will Is Enough\"', author: S, date: 'June 2025', read: '4 min read',\n        excerpt: 'A will is a letter to the probate court. It does not keep your family out of court. In many cases it is the reason they are there.',\n        sections: [\n          { heading: 'What a will does', paras: ['A will names an executor, says who should receive your property, and nominates a guardian for minor children. Every one of those instructions is carried out by a chancery court judge, after your death, in a public proceeding that in Mississippi typically takes eight to sixteen months.'] },\n          { heading: 'What a will does not do', paras: ['It does nothing while you are alive and incapacitated. It does not control assets with their own beneficiary designations, like retirement accounts and life insurance, which means those can easily contradict it. It does not keep anything private, and it does not avoid probate. It is probate.'] },\n          { heading: 'When a trust makes sense', paras: ['A revocable living trust holds your assets during your life and passes them directly to your beneficiaries at death, privately and without court. It also names someone to manage things if you become incapacitated. For families who own a home in Mississippi, the cost of a trust is usually less than the cost of the probate it avoids.', 'A will is still part of every plan we write. It just should not be the whole plan.'] }\n        ] },\n      { slug: 'myth-4-estate-planning-is-just-about-death', category: 'Myths series', title: 'Myth #4: \"Estate Planning Is Just About Death\"', author: S, date: 'July 2025', read: '3 min read',\n        excerpt: 'Most of what a good plan does happens while you are alive: who makes decisions if you cannot, who raises your kids tonight, and how your affairs stay private.',\n        sections: [\n          { heading: 'Planning for the hospital, not the funeral', paras: ['Durable powers of attorney and healthcare directives are the documents families actually reach for. They let a trusted person pay your bills, deal with your insurer and speak to your doctors if you cannot. Without them, your family petitions a court for a conservatorship, which is slow, expensive and public.'] },\n          { heading: 'Planning for tonight', paras: ['If you have minor children, the most urgent part of your plan is not what happens in twenty years. It is who a police officer calls at two in the morning if you are in an accident. Guardianship planning answers that in writing so your children are never placed with strangers, even briefly.'] },\n          { heading: 'Planning for the living', paras: ['A well-built plan also protects the people you leave things to: from creditors, from a divorce, from receiving too much too young. It is a tool for taking care of your family for decades, not a document about one day.', 'That is what we mean when we say we plan for what actually happens, not just for the paperwork.'] }\n        ] }\n    ];\n  }\n  privacySections() {\n    return [\n      { id: 'collect', heading: 'Information we collect', paras: ['When you call, email or complete a form on this site, we collect the information you choose to share: your name, phone number, email address, the type of legal matter and any notes you include. We also receive standard technical information from your browser, such as your IP address and the pages you visit, through ordinary web server logs and embedded services.'] },\n      { id: 'use', heading: 'How we use it', paras: ['We use your contact information to respond to your inquiry, schedule consultations and provide legal services you request. We do not sell your information, and we do not share it with third parties for their marketing.', 'Information about your legal matter is treated as confidential in accordance with the Mississippi Rules of Professional Conduct, whether or not you become a client.'] },\n      { id: 'embeds', heading: 'Embedded services', paras: ['This site embeds video players, a map and web fonts from third-party providers. Those providers may set cookies or collect usage data under their own privacy policies when the content loads in your browser.'] },\n      { id: 'retention', heading: 'Retention and security', paras: ['We keep inquiry information as long as needed to respond to you and to meet our professional record-keeping obligations. We use reasonable administrative and technical safeguards to protect it, though no method of transmission over the internet is completely secure.'] },\n      { id: 'rights', heading: 'Your choices', paras: ['You may ask us to correct or delete the contact information we hold about you by emailing stephen@rosslawoffice.net or calling 662-494-2593. Requests are subject to any legal or ethical obligation we have to retain records.'] },\n      { id: 'notice', heading: 'No attorney-client relationship', paras: ['Contacting us through this website does not create an attorney-client relationship. Please do not send confidential information until we have confirmed in writing that we represent you. This site is attorney advertising. Free background information is available upon request.'] },\n      { id: 'contact', heading: 'Contact', paras: ['Ross Law Office, PLLC · 384 Court Street, West Point, Mississippi 39773 · 662-494-2593.'] }\n    ];\n  }\n  startHeroLoop(el) {\n    clearInterval(this.heroLoop);\n    if (!el) return;\n    const base = el.getAttribute('src');\n    this.heroLoop = setInterval(() => { if (document.contains(el)) el.src = base + '&r=' + Date.now(); else clearInterval(this.heroLoop); }, 58000);\n  }\n  reasons() {\n    return [\n        { icon: ASSETS['assets/icon-estate.svg'], title: 'Estate planning focus', text: 'Stephen S. Ross leads a practice built around one question: what happens to your family and your assets if something happens to you?' },\n        { icon: ASSETS['assets/icon-mississippi.svg'], title: 'Local expertise', text: 'As your neighbors, we know the laws, values and unique needs of Mississippi families.' },\n        { icon: ASSETS['assets/icon-comprehensive.svg'], title: 'Comprehensive approach', text: 'We go beyond documents to build complete family protection systems with ongoing support.' },\n        { icon: ASSETS['assets/icon-team.svg'], title: 'Experienced team', text: 'With nearly a century of combined experience, your matters are handled with care and precision.' },\n        { icon: ASSETS['assets/icon-family.svg'], title: 'Family-focused practice', text: 'We help families with minor children create protection plans, guardianship and financial security.' }\n];\n  }\n  submit() {\n    const f = this.state.form, to = this.props.inboxEmail ?? 'stephen@rosslawoffice.net';\n    const body = ['New consultation request from rosslawoffice.net', '', 'Name: ' + f.name, 'Phone: ' + f.phone, 'Email: ' + f.email, 'Matter: ' + f.matter, 'Best time to call: ' + f.time, 'Notes: ' + (f.notes || '—')].join('\\n');\n    const endpoint = this.props.formEndpoint;\n    if (endpoint) {\n      fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ _to: to, _subject: 'Consultation request — ' + f.name, ...f }) }).catch(() => {});\n    } else {\n      window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent('Consultation request — ' + (f.name || 'website visitor')) + '&body=' + encodeURIComponent(body);\n    }\n    this.setState({ sent: true });\n  }\n  faqGroups() {\n    const open = this.state.openFaq;\n    const groups = [\n      { id: 'about', title: 'About Ross Law Office', items: [\n        { q: 'What makes Ross Law Office different from other estate planning attorneys?', a: ['Three things set us apart:'], list: ['Outcome-focused planning — we design for what actually happens to your family, not just the paperwork.', 'Relationship-based planning — we don\\'t create documents and disappear. We build lifetime relationships with ongoing guidance and plan maintenance.', 'An experienced legal team — nearly a century of combined legal experience under one roof.'] },\n        { q: 'Do you only do estate planning?', a: ['Estate planning is our primary focus, but we also handle real estate closings, civil practice, personal injury, and expungements. That breadth strengthens our planning — we understand how different areas of law intersect with your family\\'s situation.'] },\n        { q: 'Where are you located, and do you work with families outside West Point?', a: ['Our office is at 384 Court Street in West Point, Mississippi. We serve families across the Golden Triangle and throughout the state — many of our planning meetings can be handled by phone or video if travel is difficult.'] }\n      ]},\n      { id: 'planning', title: 'General estate planning', items: [\n        { q: 'Why do I need estate planning if I don\\'t have a lot of money?', a: ['Estate planning isn\\'t about money — it\\'s about protecting the people you love. If you have minor children, it ensures they\\'re raised by people you choose, not strangers appointed by a court.', 'Even modest assets can get tied up in probate for 8–16 months, costing your family time, money, and privacy during an already difficult time.'], note: 'Our Family Plan starts at $2,000 and includes guardianship nominations, healthcare directives, and powers of attorney.' },\n        { q: 'What\\'s the difference between a will and a trust?', a: ['A will tells the court what you want to happen to your assets after you die — but your family still goes through the expensive, slow, and public probate process. A trust lets your assets pass directly to your beneficiaries privately, quickly, and without court involvement.'], note: 'Think of it this way: a will is a set of instructions for the court. A trust is a way to avoid court entirely.' },\n        { q: 'How much does probate cost?', a: ['Probate typically costs about 5% of your gross estate value, plus 8–16 months of time — and everything becomes public record. For a $500,000 estate, that\\'s roughly $25,000 that could have been avoided with proper planning.', 'Our Trust Plan and Wealth Plan eliminate probate entirely, often saving families far more than the cost of the planning itself.'] },\n        { q: 'What is guardianship planning for minor children?', a: ['If something happened to you tonight, who would the authorities call? Guardianship planning answers that in writing: short-term guardians who can be there within minutes, long-term guardian nominations, confidential exclusions of anyone you would never want raising your children, and instructions for their care.'] }\n      ]},\n      { id: 'process', title: 'Our planning process', items: [\n        { q: 'What happens in the initial planning meeting?', a: ['This two-hour meeting is where we analyze your current situation and design your legacy estate plan. Stephen will show you exactly what would happen to your family and assets under current law, then demonstrate how proper planning changes everything.', 'You\\'ll leave knowing:'], list: ['Which plan level is right for your family', 'Exactly what it will cost — no surprises', 'How your plan will protect your loved ones', 'Your next steps to get protected'], note: 'We ask for a little homework beforehand so we can make the most of our time together.' },\n        { q: 'How long does the planning process take?', a: ['Typically 4–6 weeks from your planning meeting to final signing, using a proven process:'], list: ['Planning meeting — design your plan', 'Plan preparation — we draft your documents (about 4 weeks)', 'Signing meeting — execute your plan and make sure everything is properly implemented', 'Binder delivery — your original signed documents, plus a jump drive of digital copies'] },\n        { q: 'What happens after my plan is signed?', a: ['A plan only works if it stays current. We build in periodic reviews so that as your family, assets, and the law change, your plan changes with them — and your assets stay properly titled so your family never lands in probate by accident.'] }\n      ]},\n      { id: 'fees', title: 'Fees & investment', items: [\n        { q: 'How much is it going to cost me?', a: ['Honest answer: you can definitely find cheaper documents elsewhere. But there\\'s a critical difference between cheap documents and a plan that actually works.', 'We regularly meet families who paid a few hundred dollars for a \"will package\" only to discover, in their time of grief, that:'], list: ['Assets weren\\'t titled correctly', 'Documents were outdated or incomplete', 'The family still ended up in expensive probate', 'The \"plan\" never addressed their actual needs'], note: 'Our legacy estate plans range from $2,000 to $8,000 depending on your needs — and families often save far more than that by avoiding probate and complications.' },\n        { q: 'Do you offer payment plans?', a: ['We understand that proper planning is an investment. Payment options are discussed during your planning meeting — we\\'re committed to helping families get the protection they need.'] },\n        { q: 'Is the first call really free?', a: ['Yes. The 15-minute call costs nothing and comes with no obligation. Its only job is to help you decide whether a will, a trust, or something else fits your family — and whether we\\'re the right people to help.'] }\n      ]}\n    ];\n    return groups.map((g, gi) => ({ ...g, num: '0' + (gi + 1), items: g.items.map((f, i) => {\n      const id = 'abcd'[gi] + i, isOpen = open === id;\n      return { ...f, open: isOpen, toggle: () => this.setState({ openFaq: isOpen ? null : id }),\n        hasList: !!f.list, list: f.list || [], hasNote: !!f.note, note: f.note || '',\n        rows: isOpen ? '1fr' : '0fr', rot: isOpen ? '45deg' : '0deg', iconBg: isOpen ? '#F7F1E0' : 'transparent',\n        border: isOpen ? '#BFA750' : '#E2DCD2', shadow: isOpen ? '0 12px 32px rgba(11,31,61,.10)' : 'none' };\n    }) }));\n  }\n  set(f) { return e => { const v = e.target.v
